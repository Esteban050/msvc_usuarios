spring.application.name=msvc_usuarios
server.port=${SERVER_PORT:8001}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/msvc-usuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgress}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Client http
msvc.cursos.url=${MSVC_CURSOS_URL:msvc-cursos:8002}
